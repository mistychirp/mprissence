# ~/.config/mprissence/config.toml

# Required. Create an application at https://discord.com/developers/applications
# and paste its "Application ID" here. Its name shows on the activity card,
# and after "Listening to" when display = "name".
client_id = "000000000000000000"

# What follows "Listening to" in the member list: "artist" (default),
# "title", or "name" (the Discord application's name).
display = "artist"

# Players to ignore. Matched case-insensitively as a substring of the MPRIS
# bus name (org.mpris.MediaPlayer2.<name>) or the player's display name.
# `busctl --user list | grep mpris` shows what's running.
ignore = ["firefox", "chromium"]

# Keep the presence up (without a progress bar) while paused.
show_paused = false

# Shown when a track has no https cover art (local players usually only give
# file:// paths). Either an https URL or the key of an image uploaded under
# Rich Presence → Art Assets in the developer portal.
# fallback_image = "logo"

# The Deezer app only reports a track's main artist. With this on, the full
# credits ("Post Malone, Swae Lee") are fetched from api.deezer.com, once per
# track. Off by default since it makes network requests.
# deezer_contributors = true

# Navidrome covers come with your login in the URL and usually point at a
# LAN address, so mprissence won't pass them to Discord. If you run a public
# cover proxy (see contrib/cover-proxy), map them to it; only the cover ID
# is sent.
# [navidrome]
# server = "http://192.168.1.61:4533"   # as your player (e.g. Feishin) uses it
# cover_url = "https://covers.your-tailnet.ts.net/cover/{id}"

# Small badge over the cover art and its tooltip. Same rules as fallback_image:
# an https URL or an Art Assets key.
# small_image = "nixos-logo"
# small_text = "Listening on Nix"
